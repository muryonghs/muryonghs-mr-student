<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무룡고등학교 TV 현황판</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* === 애플 스타일 기본 설정 (화이트/라이트그레이 톤) === */
        body { font-family: 'Pretendard', sans-serif; background: #f5f5f7; color: #1d1d1f; margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; letter-spacing: -0.5px; }
        
        /* 상단 헤더 */
        .header { padding: 30px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.7); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); z-index: 100; }
        .header-title { font-size: 2.2rem; font-weight: 800; color: #1d1d1f; display: flex; align-items: center; gap: 15px; letter-spacing: -1px; }
        .header-clock { font-size: 2.5rem; font-weight: 800; color: #1d1d1f; text-align: right; }
        .header-date { font-size: 1.2rem; color: #86868b; font-weight: 600; margin-bottom: 5px; }

        /* 화면 전환 컨테이너 */
        .slide-container { flex: 1; position: relative; width: 100%; height: 100%; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 60px 50px; box-sizing: border-box; display: flex; flex-direction: column; opacity: 0; transition: opacity 0.8s ease-in-out; pointer-events: none; z-index: 1; }
        .slide.active { opacity: 1; pointer-events: auto; z-index: 10; }

        /* 공통 제목 */
        .slide-title { font-size: 4rem; font-weight: 800; text-align: center; margin-bottom: 60px; color: #1d1d1f; letter-spacing: -1.5px; }

        /* 1. 양심우산 */
        .umb-status-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .umb-icon { font-size: 12rem; margin-bottom: 30px; text-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .umb-text { font-size: 4.5rem; font-weight: 800; padding: 25px 70px; border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: all 0.3s; }
        .umb-on { background: #34c759; color: white; }
        .umb-off { background: #ff3b30; color: white; }

        /* 2. 시설예약현황 */
        .facility-table { width: 100%; max-width: 1200px; margin: 0 auto; border-collapse: separate; border-spacing: 0; background: #ffffff; border-radius: 30px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #e5e5ea; }
        .facility-table th { background: #fbfbfd; color: #86868b; font-size: 1.6rem; padding: 25px; text-align: center; font-weight: 700; border-bottom: 1px solid #e5e5ea; }
        .facility-table td { font-size: 1.8rem; padding: 30px 25px; text-align: center; border-bottom: 1px solid #f5f5f7; font-weight: 600; color: #1d1d1f; }
        .facility-table tr:last-child td { border-bottom: none; }
        .badge { padding: 12px 24px; border-radius: 20px; font-size: 1.4rem; font-weight: 800; }
        .badge-approved { background: #e3f5eb; color: #196a3e; }
        
        /* 3 & 4. 가로 스크롤(행사, 분실물) 카드 */
        .marquee-wrapper { width: 100%; flex: 1; overflow: hidden; position: relative; display: flex; align-items: center; }
        .marquee-content { display: flex; gap: 40px; position: absolute; width: max-content; }
        
        .card { width: 480px; background: #ffffff; border-radius: 35px; padding: 25px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.06); border: 1px solid #e5e5ea; flex-shrink: 0; }
        
        /* 사진이 잘리지 않도록 object-fit: contain 적용 및 여백 처리 */
        .card-img { width: 100%; height: 350px; object-fit: contain; background: #f5f5f7; border-radius: 20px; margin-bottom: 25px; }
        
        .card-title { font-size: 2.2rem; font-weight: 800; color: #1d1d1f; margin: 0 0 12px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-info { font-size: 1.4rem; color: #86868b; font-weight: 600; line-height: 1.5; }
        .card-info strong { color: #1d1d1f; }
        
        /* 5. 학사일정 */
        .calendar-list { max-width: 1000px; margin: 0 auto; width: 100%; }
        .cal-item { display: flex; align-items: center; background: #ffffff; margin-bottom: 20px; padding: 35px 50px; border-radius: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #e5e5ea; }
        .cal-date { font-size: 2.5rem; font-weight: 800; color: #0071e3; width: 250px; letter-spacing: -1px; }
        .cal-name { font-size: 2.5rem; font-weight: 700; color: #1d1d1f; }

        /* 6. QR코드 건의함 */
        .qr-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .qr-image { width: 400px; height: 400px; background: white; padding: 25px; border-radius: 40px; margin-bottom: 50px; box-shadow: 0 20px 50px rgba(0,0,0,0.08); border: 1px solid #e5e5ea; }
        .qr-desc { font-size: 2.5rem; color: #86868b; font-weight: 600; text-align: center; line-height: 1.6; }
        .qr-desc strong { color: #0071e3; font-weight: 800; }

        /* 프로그레스 바 (하단) */
        .progress-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: #e5e5ea; z-index: 1000; }
        .progress-bar { height: 100%; background: #0071e3; width: 0%; border-radius: 0 4px 4px 0; }
        
        .empty-msg { font-size: 2.5rem; color: #86868b; text-align: center; width: 100%; font-weight: 600; padding: 50px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">🎓 무룡고등학교 학생 통합 포털</div>
        <div>
            <div class="header-date" id="current-date">로딩중...</div>
            <div class="header-clock" id="current-time">00:00:00</div>
        </div>
    </div>

    <div class="slide-container">
        <!-- 1. 양심우산 -->
        <div class="slide" id="slide-0" data-type="static">
            <div class="slide-title">☔️ 양심우산 운영 현황</div>
            <div class="umb-status-box">
                <div class="umb-icon">☂️</div>
                <div id="umb-display" class="umb-text umb-on">데이터 확인 중...</div>
            </div>
        </div>

        <!-- 2. 시설예약현황 -->
        <div class="slide" id="slide-1" data-type="static">
            <div class="slide-title">🏟️ 오늘의 시설 예약 현황</div>
            <table class="facility-table">
                <thead><tr><th>예약자</th><th>장소</th><th>이용 시간</th><th>상태</th></tr></thead>
                <tbody id="fac-list"></tbody>
            </table>
        </div>

        <!-- 3. 학생회 행사 (스크롤) -->
        <div class="slide" id="slide-2" data-type="scroll">
            <div class="slide-title">🎉 학생회 행사 안내</div>
            <div class="marquee-wrapper">
                <div class="marquee-content" id="council-list"></div>
            </div>
        </div>

        <!-- 4. 학사일정 -->
        <div class="slide" id="slide-3" data-type="static">
            <div class="slide-title">📅 다가오는 학사 일정</div>
            <div class="calendar-list" id="calendar-list"></div>
        </div>

        <!-- 5. 분실물 (스크롤) -->
        <div class="slide" id="slide-4" data-type="scroll">
            <div class="slide-title">🔍 주인 잃은 물건을 찾습니다</div>
            <div class="marquee-wrapper">
                <div class="marquee-content" id="lost-list"></div>
            </div>
        </div>

        <!-- 6. 건의함 QR -->
        <div class="slide" id="slide-5" data-type="static">
            <div class="slide-title">💡 학생회 건의함</div>
            <div class="qr-box">
                <!-- 스마트폰으로 포털 주소를 찍을 수 있게 생성 -->
                <img class="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://무룡고포털주소.com&margin=10" alt="건의함 QR">
                <div class="qr-desc">스마트폰 카메라로 QR코드를 스캔하여<br><strong>무룡고 통합 포털</strong>에 접속 후 의견을 남겨주세요!</div>
            </div>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progress"></div>
    </div>

    <script>
        // Supabase 초기화 (기존 동일)
        const DB_URL = 'https://vfftkdnzjemeipuhlzfv.supabase.co';
        const DB_KEY = 'sb_publishable_9Q7vn7So6HvUSMPu5BhyDA_9qz928H-';
        const db = window.supabase.createClient(DB_URL, DB_KEY);

        const curr = new Date();
        const utc = curr.getTime() + (curr.getTimezoneOffset() * 60 * 1000);
        const kstDate = new Date(utc + (9 * 60 * 60 * 1000));
        const todayStr = kstDate.toISOString().split('T')[0];

        // 슬라이드 타이머 설정
        const slides = document.querySelectorAll('.slide');
        let currentSlideIndex = 0;
        const staticSlideDuration = 10000; // 고정된 화면(예약, 달력 등) 대기시간: 10초
        const scrollSpeed = 200; // 스크롤 속도 (1초당 이동 픽셀) - 숫자가 작을수록 느림

        // 시계 업데이트
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const day = days[now.getDay()];
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('current-date').innerText = `${year}년 ${month}월 ${date}일 (${day}요일)`;
            document.getElementById('current-time').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 데이터 Fetch 로직
        async function fetchUmbrellaStatus() {
            try {
                const { data } = await db.from('announcements').select('content').eq('id', 4).single();
                const umbEl = document.getElementById('umb-display');
                if (data && data.content === 'CLOSED') {
                    umbEl.innerText = "현재 운영 중단";
                    umbEl.className = "umb-text umb-off";
                } else {
                    umbEl.innerText = "현재 대여 가능";
                    umbEl.className = "umb-text umb-on";
                }
            } catch(e) {}
        }

        async function fetchFacilityStatus() {
            try {
                const { data } = await db.from('reservations').select('*')
                    .eq('status', 'approved').gte('start_time', todayStr)
                    .order('start_time', { ascending: true }).limit(5);

                const list = document.getElementById('fac-list');
                if (!data || data.length === 0) {
                    list.innerHTML = '<tr><td colspan="4" style="padding: 60px; color:#86868b;">오늘 확정된 예약이 없습니다.</td></tr>';
                    return;
                }
                list.innerHTML = data.map(res => {
                    const d1 = new Date(res.start_time);
                    const d2 = new Date(res.end_time);
                    const timeStr = `${String(d1.getHours()).padStart(2,'0')}:${String(d1.getMinutes()).padStart(2,'0')} ~ ${String(d2.getHours()).padStart(2,'0')}:${String(d2.getMinutes()).padStart(2,'0')}`;
                    const nameStr = `${res.student_name.charAt(0)}*${res.student_name.charAt(res.student_name.length-1)}`;
                    return `<tr>
                        <td>${nameStr} <span style="font-size:1.3rem; color:#86868b; margin-left:5px;">(${res.student_id.toString().substring(0,2)}**)</span></td>
                        <td><strong>${res.room_name}</strong></td>
                        <td>${timeStr}</td>
                        <td><span class="badge badge-approved">승인완료</span></td>
                    </tr>`;
                }).join('');
            } catch(e) {}
        }

        async function fetchCouncilEvents() {
            const listDiv = document.getElementById('council-list');
            const { data } = await db.from('student_council_events').select('*').order('created_at', { ascending: false });
            
            if (!data || data.length === 0) {
                listDiv.innerHTML = '<div class="empty-msg">진행 중인 행사가 없습니다.</div>';
                return;
            }
            listDiv.innerHTML = data.map(ev => {
                const img = ev.poster_url ? ev.poster_url : 'https://via.placeholder.com/400x350/e5e5ea/86868b?text=No+Image';
                return `
                    <div class="card">
                        <img src="${img}" class="card-img" alt="행사">
                        <div class="card-title">${ev.title}</div>
                        <div class="card-info">📅 <strong>기간:</strong> ${ev.event_period}<br>🏢 <strong>주관:</strong> ${ev.department}</div>
                    </div>`;
            }).join('');
        }

        async function fetchLostItems() {
            const listDiv = document.getElementById('lost-list');
            const { data } = await db.from('lost_and_found').select('*').order('created_at', { ascending: false });
            
            if (!data || data.length === 0) {
                listDiv.innerHTML = '<div class="empty-msg">등록된 분실물이 없습니다.</div>';
                return;
            }
            listDiv.innerHTML = data.map(item => {
                const img = item.photo_url ? item.photo_url : 'https://via.placeholder.com/400x350/e5e5ea/86868b?text=No+Image';
                return `
                    <div class="card">
                        <img src="${img}" class="card-img" alt="분실물">
                        <div class="card-title">${item.item_name}</div>
                        <div class="card-info">📍 <strong>발견:</strong> ${item.found_location}<br>🏃‍♂️ <strong>수령:</strong> ${item.pickup_location}</div>
                    </div>`;
            }).join('');
        }

        async function fetchNeisCalendar() { 
            const listDiv = document.getElementById('calendar-list'); 
            try { 
                const yyyy = kstDate.getFullYear(); 
                const mm = String(kstDate.getMonth() + 1).padStart(2, '0'); 
                const dd = String(kstDate.getDate()).padStart(2, '0');
                const fromDate = `${yyyy}${mm}${dd}`; 
                const toDate = `${yyyy}1231`; 
                const todayYMD = parseInt(fromDate);
                
                const res = await fetch(`https://open.neis.go.kr/hub/SchoolSchedule?Type=json&ATPT_OFCDC_SC_CODE=H10&SD_SCHUL_CODE=7480070&AA_FROM_YMD=${fromDate}&AA_TO_YMD=${toDate}`); 
                const data = await res.json(); 
                
                if(data.SchoolSchedule) { 
                    const events = data.SchoolSchedule[1].row.filter(e => e.EVENT_NM !== '토요휴업일' && e.EVENT_NM !== '휴업일' && parseInt(e.AA_YMD) >= todayYMD); 
                    if(events.length === 0) { listDiv.innerHTML = '<div class="empty-msg">예정된 학사일정이 없습니다.</div>'; return; } 
                    
                    const displayEvents = events.slice(0, 5);
                    listDiv.innerHTML = displayEvents.map(e => `
                        <div class="cal-item">
                            <div class="cal-date">${e.AA_YMD.substring(4,6)}월 ${e.AA_YMD.substring(6,8)}일</div>
                            <div class="cal-name">${e.EVENT_NM}</div>
                        </div>
                    `).join(''); 
                } else { listDiv.innerHTML = '<div class="empty-msg">일정이 없습니다.</div>'; } 
            } catch(e) { listDiv.innerHTML = '<div class="empty-msg">일정을 불러오지 못했습니다.</div>'; } 
        }

        function loadAllData() {
            fetchUmbrellaStatus();
            fetchFacilityStatus();
            fetchCouncilEvents();
            fetchLostItems();
            fetchNeisCalendar();
        }

        // --- 핵심 로직: 동적 타이머 및 스크롤 완료 후 다음 슬라이드 --- //
        
        function animateProgressBar(duration) {
            const progressBar = document.getElementById('progress');
            progressBar.style.transition = 'none';
            progressBar.style.width = '0%';
            
            setTimeout(() => {
                progressBar.style.transition = `width ${duration}ms linear`;
                progressBar.style.width = '100%';
            }, 50);
        }

        function playNextSlide() {
            slides[currentSlideIndex].classList.remove('active');
            
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            
            // 첫 화면으로 돌아오면 백그라운드 데이터 갱신
            if(currentSlideIndex === 0) {
                loadAllData();
            }
            
            showCurrentSlide();
        }

        function showCurrentSlide() {
            const slide = slides[currentSlideIndex];
            slide.classList.add('active');

            const slideType = slide.getAttribute('data-type');
            
            // 스크롤(가로 이동)이 필요한 화면일 경우
            if (slideType === 'scroll') {
                const marqueeContent = slide.querySelector('.marquee-content');
                
                // 데이터가 비어있는 경우 (등록된 행사/분실물이 없음)
                if (marqueeContent.children.length === 0 || marqueeContent.innerHTML.includes('empty-msg')) {
                    animateProgressBar(staticSlideDuration);
                    setTimeout(playNextSlide, staticSlideDuration);
                } else {
                    // 애니메이션 초기화 (우측 화면 밖으로 이동)
                    marqueeContent.style.transition = 'none';
                    marqueeContent.style.transform = `translateX(100vw)`;
                    
                    // DOM 업데이트(위치 초기화)를 위한 짧은 지연 후 애니메이션 시작
                    setTimeout(() => {
                        // 내용물의 실제 가로 길이
                        const contentWidth = marqueeContent.scrollWidth;
                        // 이동해야 할 전체 거리 = 화면 가로 길이(100vw) + 내용물 전체 길이
                        const distance = window.innerWidth + contentWidth;
                        // 소요 시간 계산 = 거리 / 속도
                        const duration = (distance / scrollSpeed) * 1000;

                        // 스크롤 애니메이션 실행 (좌측 끝까지)
                        marqueeContent.style.transition = `transform ${duration}ms linear`;
                        marqueeContent.style.transform = `translateX(-${contentWidth}px)`;

                        animateProgressBar(duration);
                        
                        // 스크롤이 완전히 끝난 후 다음 화면으로 넘김!
                        setTimeout(playNextSlide, duration);
                    }, 100);
                }
            } 
            // 일반 고정 화면일 경우 (양심우산, 예약현황, 달력, QR)
            else {
                animateProgressBar(staticSlideDuration);
                setTimeout(playNextSlide, staticSlideDuration);
            }
        }

        // 시스템 시작
        loadAllData();
        
        // 데이터 불러올 시간을 짧게 주고 첫 슬라이드 실행
        setTimeout(() => {
            showCurrentSlide();
        }, 500);

    </script>
</body>
</html>
