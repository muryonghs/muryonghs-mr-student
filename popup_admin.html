<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV 팝업 관리자</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* 모바일 최적화 애플 스타일 */
        body { font-family: 'Pretendard', sans-serif; background: #f5f5f7; margin: 0; padding: 0; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
        
        .header { background: rgba(255, 255, 255, 0.8); backdrop-filter: saturate(180%) blur(20px); padding: 15px 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.05); text-align: center; }
        .header h1 { margin: 0; font-size: 1.2rem; font-weight: 800; }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 50px; }
        
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .card h2 { margin: 0 0 15px 0; font-size: 1.1rem; font-weight: 800; color: #1d1d1f; }

        /* 입력 폼 스타일 */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; color: #86868b; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 14px; box-sizing: border-box; border: 1.5px solid #e5e5ea; border-radius: 12px; font-size: 1rem; font-family: inherit; background: #fbfbfd; transition: border-color 0.2s; }
        .form-control:focus { outline: none; border-color: #0071e3; background: white; }
        textarea.form-control { resize: none; height: 100px; }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0071e3; color: white; }
        .btn-primary:active { background: #005bb5; transform: scale(0.98); }
        
        /* 목록 아이템 스타일 */
        .list-item { border-bottom: 1px solid #f5f5f7; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .list-item:last-child { border-bottom: none; }
        .item-info { flex: 1; min-width: 0; padding-right: 15px; }
        .item-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-meta { font-size: 0.8rem; color: #86868b; }
        
        /* 토글 스위치 */
        .toggle-btn { padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; border: none; cursor: pointer; white-space: nowrap; }
        .toggle-on { background: #34c759; color: white; }
        .toggle-off { background: #e5e5ea; color: #86868b; }
        .delete-btn { background: none; border: none; color: #ff3b30; font-size: 0.8rem; font-weight: 700; padding: 5px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📺 TV 팝업 관리자</h1>
    </div>

    <div class="container">
        <!-- 새 팝업 등록 폼 -->
        <div class="card">
            <h2>새로운 팝업 등록</h2>
            
            <div class="form-group">
                <label>팝업 제목 (화면 상단에 표시)</label>
                <input type="text" id="title" class="form-control" placeholder="예: 학생회장 선거 유세 영상">
            </div>
            
            <div class="form-group">
                <label>종류 선택</label>
                <select id="media_type" class="form-control" onchange="toggleInputs()">
                    <option value="youtube">유튜브 영상</option>
                    <option value="image">포스터 / 사진</option>
                    <option value="text">텍스트 (글 공지)</option>
                </select>
            </div>
            
            <div class="form-group" id="url_group">
                <label>링크 (URL)</label>
                <input type="text" id="media_url" class="form-control" placeholder="유튜브 링크 또는 이미지 주소 붙여넣기">
            </div>
            
            <div class="form-group" id="text_group" style="display: none;">
                <label>공지 내용</label>
                <textarea id="message" class="form-control" placeholder="화면에 띄울 내용을 적어주세요"></textarea>
            </div>
            
            <button class="btn btn-primary" onclick="submitPopup()">바로 화면에 띄우기</button>
        </div>

        <!-- 등록된 팝업 목록 -->
        <div class="card">
            <h2>팝업 목록 관리</h2>
            <p style="font-size: 0.85rem; color: #86868b; margin-top: -5px; margin-bottom: 15px;">
                💡 '켜짐' 상태인 팝업 중 가장 최근 1개만 화면에 표시됩니다.<br>
                화면에서 내리려면 버튼을 눌러 '꺼짐'으로 변경하세요.
            </p>
            <div id="popup-list">목록을 불러오는 중...</div>
        </div>
    </div>

    <script>
        // Supabase 초기화
        const DB_URL = 'https://vfftkdnzjemeipuhlzfv.supabase.co';
        const DB_KEY = 'sb_publishable_9Q7vn7So6HvUSMPu5BhyDA_9qz928H-';
        const db = window.supabase.createClient(DB_URL, DB_KEY);

        // 입력 폼 동적 변경 (종류 선택에 따라)
        function toggleInputs() {
            const type = document.getElementById('media_type').value;
            if (type === 'text') {
                document.getElementById('url_group').style.display = 'none';
                document.getElementById('text_group').style.display = 'block';
            } else {
                document.getElementById('url_group').style.display = 'block';
                document.getElementById('text_group').style.display = 'none';
            }
        }

        // 팝업 목록 불러오기
        async function loadPopups() {
            const listDiv = document.getElementById('popup-list');
            const { data, error } = await db.from('tv_popups').select('*').order('created_at', { ascending: false }).limit(10);
            
            if (error || !data || data.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#86868b;">등록된 팝업이 없습니다.</p>';
                return;
            }

            listDiv.innerHTML = data.map(p => {
                const typeName = p.media_type === 'youtube' ? '유튜브' : (p.media_type === 'image' ? '사진' : '텍스트');
                const btnClass = p.is_active ? 'toggle-btn toggle-on' : 'toggle-btn toggle-off';
                const btnText = p.is_active ? '화면에 켜짐' : '꺼짐';
                
                return `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-title">${p.title}</div>
                            <div class="item-meta">종류: ${typeName}</div>
                            <button class="delete-btn" onclick="deletePopup(${p.id})">삭제</button>
                        </div>
                        <div>
                            <button class="${btnClass}" onclick="toggleStatus(${p.id}, ${p.is_active})">${btnText}</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 새 팝업 등록하기 (자동으로 화면에 켜짐)
        async function submitPopup() {
            const title = document.getElementById('title').value.trim();
            const mediaType = document.getElementById('media_type').value;
            const mediaUrl = document.getElementById('media_url').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!title) return alert('제목을 입력해주세요.');
            if (mediaType !== 'text' && !mediaUrl) return alert('링크(URL)를 입력해주세요.');
            if (mediaType === 'text' && !message) return alert('공지 내용을 입력해주세요.');

            const btn = document.querySelector('.btn-primary');
            btn.innerText = "전송 중...";
            btn.disabled = true;

            const { error } = await db.from('tv_popups').insert([{
                title: title,
                media_type: mediaType,
                media_url: mediaType !== 'text' ? mediaUrl : null,
                message: mediaType === 'text' ? message : null,
                is_active: true // 등록하자마자 바로 켜짐
            }]);

            btn.innerText = "바로 화면에 띄우기";
            btn.disabled = false;

            if (error) {
                alert('등록 중 오류가 발생했습니다.');
            } else {
                alert('성공적으로 화면에 팝업을 띄웠습니다!');
                document.getElementById('title').value = '';
                document.getElementById('media_url').value = '';
                document.getElementById('message').value = '';
                loadPopups();
            }
        }

        // 켜기/끄기 토글
        async function toggleStatus(id, currentStatus) {
            const newStatus = !currentStatus;
            const { error } = await db.from('tv_popups').update({ is_active: newStatus }).eq('id', id);
            
            if (!error) {
                loadPopups();
            } else {
                alert('상태 변경에 실패했습니다.');
            }
        }

        // 팝업 삭제
        async function deletePopup(id) {
            if (!confirm('이 팝업 기록을 완전히 삭제하시겠습니까?')) return;
            
            const { error } = await db.from('tv_popups').delete().eq('id', id);
            if (!error) {
                loadPopups();
            } else {
                alert('삭제에 실패했습니다.');
            }
        }

        // 초기 실행
        loadPopups();
    </script>
</body>
</html>
