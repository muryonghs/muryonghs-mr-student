<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV 팝업 관리자</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f5f5f7; margin: 0; padding: 0; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
        
        .header { background: rgba(255, 255, 255, 0.8); backdrop-filter: saturate(180%) blur(20px); padding: 15px 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0,0,0,0.05); text-align: center; }
        .header h1 { margin: 0; font-size: 1.2rem; font-weight: 800; }

        .container { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 50px; }
        
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .card h2 { margin: 0 0 15px 0; font-size: 1.1rem; font-weight: 800; color: #1d1d1f; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 700; color: #86868b; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 14px; box-sizing: border-box; border: 1.5px solid #e5e5ea; border-radius: 12px; font-size: 1rem; font-family: inherit; background: #fbfbfd; transition: border-color 0.2s; }
        .form-control:focus { outline: none; border-color: #0071e3; background: white; }
        
        /* 파일 첨부 버튼 디자인 변경 */
        input[type="file"] { background: white; padding: 10px; font-size: 0.9rem; cursor: pointer; }
        textarea.form-control { resize: none; height: 100px; }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0071e3; color: white; }
        .btn-primary:disabled { background: #86868b; cursor: not-allowed; }
        
        .list-item { border-bottom: 1px solid #f5f5f7; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .list-item:last-child { border-bottom: none; }
        .item-info { flex: 1; min-width: 0; padding-right: 15px; }
        .item-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-meta { font-size: 0.8rem; color: #86868b; }
        
        .toggle-btn { padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; border: none; cursor: pointer; white-space: nowrap; }
        .toggle-on { background: #34c759; color: white; }
        .toggle-off { background: #e5e5ea; color: #86868b; }
        .delete-btn { background: none; border: none; color: #ff3b30; font-size: 0.8rem; font-weight: 700; padding: 5px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📺 TV 팝업 관리자</h1>
    </div>

    <div class="container">
        <!-- 새 팝업 등록 폼 -->
        <div class="card">
            <h2>새로운 팝업 등록</h2>
            
            <div class="form-group">
                <label>팝업 제목 (관리용)</label>
                <input type="text" id="title" class="form-control" placeholder="예: 축제 홍보 영상">
            </div>
            
            <div class="form-group">
                <label>어떤 걸 띄울까요?</label>
                <select id="media_type" class="form-control" onchange="toggleInputs()">
                    <option value="youtube">🔴 유튜브 주소 입력</option>
                    <option value="image">🖼️ 휴대폰 사진 업로드</option>
                    <option value="video">🎥 휴대폰 영상 업로드 (.mp4)</option>
                    <option value="text">📝 텍스트 (글 공지)</option>
                </select>
            </div>
            
            <!-- 유튜브 주소용 -->
            <div class="form-group" id="url_group">
                <label>유튜브 링크</label>
                <input type="text" id="media_url" class="form-control" placeholder="유튜브 링크를 붙여넣으세요">
            </div>
            
            <!-- 사진/영상 직접 업로드용 -->
            <div class="form-group" id="file_group" style="display: none;">
                <label>파일 선택</label>
                <input type="file" id="file_input" class="form-control" accept="image/*, video/mp4, video/quicktime">
            </div>
            
            <!-- 텍스트용 -->
            <div class="form-group" id="text_group" style="display: none;">
                <label>공지 내용</label>
                <textarea id="message" class="form-control" placeholder="화면에 띄울 내용을 적어주세요"></textarea>
            </div>
            
            <button class="btn btn-primary" id="submit-btn" onclick="submitPopup()">바로 화면에 띄우기</button>
        </div>

        <!-- 등록된 팝업 목록 -->
        <div class="card">
            <h2>팝업 목록 관리</h2>
            <p style="font-size: 0.85rem; color: #86868b; margin-top: -5px; margin-bottom: 15px;">
                💡 켜져 있는 모든 팝업이 TV 화면에 차례대로 뜹니다.<br>
                화면에서 내리려면 '꺼짐'으로 변경하세요.
            </p>
            <div id="popup-list">목록을 불러오는 중...</div>
        </div>
    </div>

    <script>
        const DB_URL = 'https://vfftkdnzjemeipuhlzfv.supabase.co';
        const DB_KEY = 'sb_publishable_9Q7vn7So6HvUSMPu5BhyDA_9qz928H-';
        const db = window.supabase.createClient(DB_URL, DB_KEY);

        // 선택한 종류에 따라 입력칸 바꾸기
        function toggleInputs() {
            const type = document.getElementById('media_type').value;
            const urlGroup = document.getElementById('url_group');
            const fileGroup = document.getElementById('file_group');
            const textGroup = document.getElementById('text_group');

            urlGroup.style.display = 'none';
            fileGroup.style.display = 'none';
            textGroup.style.display = 'none';

            if (type === 'youtube') urlGroup.style.display = 'block';
            else if (type === 'text') textGroup.style.display = 'block';
            else fileGroup.style.display = 'block'; // image, video
        }

        async function loadPopups() {
            const listDiv = document.getElementById('popup-list');
            const { data, error } = await db.from('tv_popups').select('*').order('created_at', { ascending: false }).limit(10);
            
            if (error || !data || data.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#86868b;">등록된 팝업이 없습니다.</p>';
                return;
            }

            listDiv.innerHTML = data.map(p => {
                const typeName = p.media_type === 'youtube' ? '유튜브' : (p.media_type === 'image' ? '사진' : (p.media_type === 'video' ? '영상파일' : '텍스트'));
                const btnClass = p.is_active ? 'toggle-btn toggle-on' : 'toggle-btn toggle-off';
                const btnText = p.is_active ? '화면에 켜짐' : '꺼짐';
                
                return `
                    <div class="list-item">
                        <div class="item-info">
                            <div class="item-title">${p.title}</div>
                            <div class="item-meta">종류: ${typeName}</div>
                            <button class="delete-btn" onclick="deletePopup(${p.id})">삭제</button>
                        </div>
                        <div>
                            <button class="${btnClass}" onclick="toggleStatus(${p.id}, ${p.is_active})">${btnText}</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 새 팝업 등록 (파일 업로드 기능 포함)
        async function submitPopup() {
            const title = document.getElementById('title').value.trim();
            const mediaType = document.getElementById('media_type').value;
            const message = document.getElementById('message').value.trim();
            const btn = document.getElementById('submit-btn');

            if (!title) return alert('제목을 입력해주세요.');

            let finalMediaUrl = null;

            // 1. 유튜브일 경우
            if (mediaType === 'youtube') {
                finalMediaUrl = document.getElementById('media_url').value.trim();
                if (!finalMediaUrl) return alert('유튜브 링크를 입력해주세요.');
            } 
            // 2. 텍스트일 경우
            else if (mediaType === 'text') {
                if (!message) return alert('공지 내용을 입력해주세요.');
            } 
            // 3. 파일 업로드(사진/영상)일 경우
            else {
                const fileInput = document.getElementById('file_input');
                if (!fileInput.files || fileInput.files.length === 0) return alert('업로드할 파일을 선택해주세요.');
                
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                // 파일 이름이 겹치지 않게 무작위 이름 생성
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;

                // 업로드 중 버튼 상태 변경 (영상은 용량이 커서 시간이 걸릴 수 있음)
                btn.innerText = "파일 업로드 중... ⏳";
                btn.disabled = true;

                // Supabase Storage(tv_media 버킷)에 파일 업로드
                const { error: uploadError } = await db.storage.from('tv_media').upload(fileName, file);
                
                if (uploadError) {
                    btn.innerText = "바로 화면에 띄우기";
                    btn.disabled = false;
                    return alert('파일 업로드 실패: ' + uploadError.message);
                }

                // 업로드 성공 후 파일 직접 링크 가져오기
                const { data: publicUrlData } = db.storage.from('tv_media').getPublicUrl(fileName);
                finalMediaUrl = publicUrlData.publicUrl;
            }

            // DB에 데이터 저장
            btn.innerText = "데이터 저장 중...";
            const { error } = await db.from('tv_popups').insert([{
                title: title,
                media_type: mediaType,
                media_url: finalMediaUrl,
                message: mediaType === 'text' ? message : null,
                is_active: true // 등록하자마자 바로 켜짐
            }]);

            // 버튼 원상복구
            btn.innerText = "바로 화면에 띄우기";
            btn.disabled = false;

            if (error) {
                alert('등록 중 오류가 발생했습니다.');
            } else {
                alert('성공적으로 화면에 팝업을 띄웠습니다!');
                // 입력칸 초기화
                document.getElementById('title').value = '';
                document.getElementById('media_url').value = '';
                document.getElementById('message').value = '';
                document.getElementById('file_input').value = '';
                loadPopups();
            }
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = !currentStatus;
            const { error } = await db.from('tv_popups').update({ is_active: newStatus }).eq('id', id);
            if (!error) loadPopups();
        }

        async function deletePopup(id) {
            if (!confirm('이 팝업 기록을 완전히 삭제하시겠습니까? (파일도 지워집니다)')) return;
            const { error } = await db.from('tv_popups').delete().eq('id', id);
            if (!error) loadPopups();
        }

        loadPopups();
    </script>
</body>
</html>
